[package]
name = "host"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
# Receipts are saved to and loaded from files (prove/verify) with bincode.
bincode = "1.3"
hex = "0.4"
methods = { path = "../methods" }
# `prove` gives in-process execution with full session statistics (incl. paging cycles).
risc0-zkvm = { version = "=3.0.6", features = ["prove"] }
serde_json = "1.0"
