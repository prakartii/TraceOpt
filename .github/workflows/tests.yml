name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  llvm:
    # Runs the tests that need clang/opt/llc (skipped in the job above),
    # with the LLVM preinstalled on the runner image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Put LLVM on PATH
        run: |
          dir=$(ls -d /usr/lib/llvm-* | sort -V | tail -1)/bin
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/clang" --version
      - name: Run unit tests including LLVM tests
        run: python -m unittest discover -s tests -v
