name: tests

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes the running checks.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  llvm:
    # Runs the tests that need clang/opt/llc (skipped in the job above) with
    # LLVM 21, the version the fixtures and results were made with: the
    # runner's preinstalled LLVM 18 cannot read Clang 21 IR (samesign,
    # getelementptr nuw).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install LLVM 21 (apt.llvm.org)
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 21
      - name: Put LLVM on PATH
        run: |
          dir=/usr/lib/llvm-21/bin
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/clang" --version
      - name: Run unit tests including LLVM tests
        run: python -m unittest discover -s tests -v
      - name: Run the narrated demo (predictions only, no zkVM)
        run: python scripts/demo.py --no-pause --no-measure --html demo-report.html
