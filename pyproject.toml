[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "traceopt"
version = "0.0.1"
description = "Proving-cost-aware compiler optimization for zero-knowledge virtual machines (research prototype)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
traceopt = "traceopt.cli:main"

[tool.setuptools]
packages = ["traceopt"]
